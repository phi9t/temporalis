name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [phi9t-mainline]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: explorer
      - name: Build explorer
        run: npm run build
        working-directory: explorer
        env:
          VITE_BASE_PATH: /temporalis/
      - name: Publish dist to gh-pages
        working-directory: explorer/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update GitHub Pages"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
