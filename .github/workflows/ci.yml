name: CI

on:
  pull_request:
  push:
    branches: [phi9t-mainline]

permissions:
  contents: read

jobs:
  quickstart-and-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Install Python test tooling
        run: python -m pip install pytest
      - name: Run fresh-clone quickstart checks
        run: make quickstart-check
      - name: Run public release tests
        run: PYTHONPATH=. pytest -q tests/hacks/test_hacks.py tests/test_kilvin_operator_scripts.py tests/test_public_release_readiness.py
      - name: Install explorer dependencies
        run: npm ci
        working-directory: explorer
      - name: Test explorer
        run: npm test
        working-directory: explorer
      - name: Typecheck explorer
        run: npm run typecheck
        working-directory: explorer
      - name: Build explorer
        run: npm run build
        working-directory: explorer
