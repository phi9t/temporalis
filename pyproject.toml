[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monoctl"
version = "0.1.0"
description = "Workspace control plane for the temporalis monorepo workspace"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "temporalio>=1.9,<2"]

[project.scripts]
monoctl = "monoctl.cli:run"
inspectl = "inspectl.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["monoctl*", "inspectl*"]
