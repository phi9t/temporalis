[project]
name = "kilvin-trainer"
version = "0.1.0"
description = "Tiny CPU GPT-2-style trainer: the image kilvin's concretize_dependencies really builds."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
